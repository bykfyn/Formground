<style>
  main {
    max-width: 1160px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  /* Page-specific override of site.css's shared 40px - matches the
     homepage's own ask-box height exactly (2026-09-20, measured live:
     154px from viewport top on both pages), so the search box sits at
     the same place whether you land here or on the homepage. */
  .site-header { margin-bottom: 0; }

  .search-wide {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
  }

  /* --- ask box --- */
  .ask-box {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface-1); border: 0.5px solid var(--border);
    border-radius: var(--radius); padding: 13px 16px; margin-top: 0;
  }
  .ask-box i.ti-search { font-size: 18px; color: var(--text-muted); }
  .ask-box input {
    border: none; background: none; outline: none; flex: 1;
    font-size: 15px; color: var(--text-primary); font-family: inherit;
  }
  .ask-box input::placeholder { color: var(--text-muted); }

  .inline-chip {
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    font-size: 13px; color: var(--text-secondary); font-family: inherit;
    background: var(--surface-2); border: 0.5px solid var(--border-strong);
    padding: 7px 12px; margin: 0;
    cursor: pointer; border-radius: 8px; white-space: nowrap;
  }
  .inline-chip:hover { border-color: var(--text-muted); }
  .inline-chip i { font-size: 15px; }

  @media (max-width: 480px) {
    .inline-chip span { display: none; }
    .inline-chip { padding: 9px; }
  }

  /* --- results --- */
  #results-meta {
    font-size: 12px; color: var(--text-muted); text-align: center;
    margin: 32px 0 20px; display: none;
  }
  .results-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
  }
  /* Matches Creators/the homepage's category tiles (2026-09-20, see
     project memory): border/background/sharp corners live on the photo
     alone, not a card box enclosing the photo and text together - text
     sits as plain content below it. The share button now overlays the
     photo's own bottom-right corner (position: relative moved from
     .card to .card-image) rather than the old enclosing card, since
     there's no card body surface left for it to sit inside. */
  .card { display: block; text-decoration: none; color: inherit; }
  .card-image {
    aspect-ratio: 1 / 1; background: var(--surface-1);
    border: 0.5px solid var(--border); margin: 0 0 10px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }
  .card.thin .card-image { border-style: dashed; border-color: var(--border-strong); }
  .card-image i { font-size: 28px; color: var(--text-muted); }
  .card-image img { width: 100%; height: 100%; object-fit: cover; }
  .card-image img.contain-fit { object-fit: contain; }
  .card-body { padding: 0; }
  .share-btn {
    position: absolute; bottom: 6px; right: 6px; z-index: 1;
    width: 26px; height: 26px; border-radius: 50%; border: none;
    background: rgba(250, 249, 247, 0.85); color: var(--text-secondary);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
  }
  .share-btn:hover { background: var(--surface-2); color: var(--text-primary); }
  .share-btn i { font-size: 14px; }
  .share-btn.copied::after {
    content: "Copied"; position: absolute; bottom: 32px; right: 0;
    background: var(--text-primary); color: var(--surface-2);
    font-size: 11px; padding: 3px 8px; border-radius: 6px; white-space: nowrap;
  }
  /* Top-aligned, not centered, and reserving only one line's height, not
     two - a short, common single-line title used to sit centered in a
     2-line-tall box, leaving visible empty space between the image and
     the title that made the two feel disconnected. Top-aligning pulls
     title+maker name up flush under the image; a genuine 2-line title
     just pushes its own maker-name line down slightly further than its
     row-neighbors', a real but minor trade-off for shorter cards
     overall (2026-09-20, see project memory). */
  .card-title-wrap { min-height: 1.3em; display: flex; align-items: flex-start; }
  .card-title {
    font-size: 13px; font-weight: 500; margin: 0; line-height: 1.3;
    display: -webkit-box; -webkit-box-orient: vertical;
    -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden;
  }
  .card-brand {
    font-size: 12px; color: var(--text-secondary); margin: 2px 0 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-detail {
    font-size: 11px; color: var(--text-muted); margin: 0; line-height: 1.3; min-height: 1.3em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-note {
    font-size: 11px; color: var(--text-accent); margin: 0; line-height: 1.3; min-height: 1.3em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-note i { font-size: 12px; vertical-align: -1px; margin-right: 3px; }

  /* --- empty state / errors --- */
  #status { font-size: 13px; color: var(--text-muted); text-align: center; margin: 32px 0; display: none; }
  #status.error { color: #a14b3f; }
  [hidden] { display: none !important; }
</style>

        <i class="ti ti-search" aria-hidden="true"></i>
        <input id="query-input" type="text" placeholder="Search through a curated collection of work" autocomplete="off">
        <button type="button" class="inline-chip" id="discover-chip" aria-label="Surprise me"><i class="ti ti-arrows-shuffle" aria-hidden="true"></i><span>Surprise me</span></button>
      </div>
    </form>
  </div>

  <p id="status"></p>
  <p id="results-meta"></p>
  <div id="results-grid" class="results-grid"></div>

  <p class="foot-note">
    From a curated collection, equally relevant results are shown in

    No paid results.<br>

  </p>
</main>
