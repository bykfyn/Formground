<style>
  main {
    max-width: 1160px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }
  .page-head { margin-bottom: 28px; }
  .page-head p { margin: 0; font-size: 14px; color: var(--text-secondary); max-width: 560px; }

  /* Breadcrumb: reflects the sequential picks, each segment clickable to step back */
  .crumb {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    font-size: 13px; color: var(--text-muted); margin-bottom: 22px; min-height: 20px;
  }
  .crumb button {
    font: inherit; color: var(--text-secondary); background: none; border: none;
    padding: 0; cursor: pointer; text-decoration: none;
  }
  .crumb button:hover { color: var(--text-primary); text-decoration: underline; }
  .crumb .crumb-current { color: var(--text-primary); font-weight: 600; }
  .crumb .sep { color: var(--border-strong); }

  .chip-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 28px; }
  .chip-row.nested { padding-top: 4px; border-top: 1px dashed var(--border); margin-top: -8px; }
  .step-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-muted); width: 100%; margin-bottom: 2px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13.5px; font-family: inherit; color: var(--text-secondary);
    background: var(--surface-2); border: 0.5px solid var(--border-strong);
    padding: 9px 15px; cursor: pointer; border-radius: 999px; white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .chip:hover { border-color: var(--text-accent); color: var(--text-primary); }
  .chip.active { background: var(--text-primary); color: #fff; border-color: var(--text-primary); }
  .chip .count { color: var(--text-muted); font-size: 12px; }
  .chip.active .count { color: rgba(255,255,255,0.65); }

  .section-block { margin-bottom: 8px; }

  .results-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 24px 20px; margin-top: 8px;
  }
  .house-card { text-decoration: none; color: inherit; display: block; }
  .house-photo {
    aspect-ratio: 4/3; border-radius: var(--radius); overflow: hidden;
    background: var(--surface-1); margin-bottom: 10px; border: 0.5px solid var(--border);
  }
  .house-photo img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s ease; }
  .house-card:hover .house-photo img { transform: scale(1.03); }
  .house-name { font-weight: 600; font-size: 14.5px; margin: 0 0 2px; }
  .house-meta { font-size: 12.5px; color: var(--text-secondary); margin: 0 0 2px; }
  .house-credit { font-size: 12px; color: var(--text-muted); margin: 0; }

  .result-count { font-size: 12.5px; color: var(--text-muted); margin: 0 0 14px; }

  .other-category-note {
    background: var(--surface-1); border: 0.5px solid var(--border);
    border-radius: var(--radius); padding: 20px 22px; font-size: 13.5px;
    color: var(--text-secondary); line-height: 1.6; max-width: 520px;
  }
  .other-category-note a { color: var(--text-accent); font-weight: 500; }

  .empty-state { font-size: 13.5px; color: var(--text-muted); padding: 20px 0; }

  @media (max-width: 640px) {
    .results-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 18px 14px; }
  }
</style>

const HOUSES = [{"name":"Hus mellan hav och land","location":"Bohuslän","region":"Västra Götaland","year":"2024","description":"A villa by the sea in Bohuslän consisting of a main house and guest house, designed as elongated forms following the natural direction of the bedrock and cliffs toward deciduous forest, with interiors and terraces oriented to maximize views and connection between house, sea, and landscape.","image":"http://accentarkitekter.se/wp-content/uploads/2019/02/accent_vaktaren_15-1200x675.jpg","url":"http://accentarkitekter.se/projekt/hus-mellan-hav-och-land/","firm":"Accent Arkitekter AB"},{"name":"Villa Winlunden","location":"Värnamo","region":"Other Sweden","year":"2024","description":"A lakeside single-story villa designed as three coordinated structures (main house, carport, and Attefallshus) with standing panel facades in varying dimensions treated with stain, black metal cladding accents, and generous outdoor living spaces oriented toward the lake and nature.","image":"http://accentarkitekter.se/wp-content/uploads/2024/06/fh2g_1431-1200x675.jpg","url":"http://accentarkitekter.se/projekt/3321/","firm":"Accent Arkitekter AB"},{"name":"Backåkra 5 & 6, Stockholm","location":"Stockholm (Norra Djurgårdsstaden, Bobergsgatan)","region":"Stockholm","year":2013,"description":"Two three-story single-family houses with basements and roof terraces, each four meters wide and eighteen meters deep, built on narrow Manhattan-style lots and organized around private courtyards with street entrances and private outdoor spaces.","image":"https://andersson-arfwedson.se/wp-content/uploads/2022/04/Backakra_foto_fasad-mot-gata-357x500.jpg","url":"https://andersson-arfwedson.se/projekt/backakra-5-6/","firm":"Andersson Arfwedson arkitekter AB"},{"name":"Boo 1:274, Nacka","location":"Nacka (Lännersta), Stockholm","region":"Stockholm","year":"2009","description":"A single-family house built with lightweight concrete elements, featuring a white rendered facade with slate socle and standing seam Rheinzink roof, arranged as two perpendicular wings with shared living spaces on the ground floor and private bedrooms on the upper floor.","image":"https://andersson-arfwedson.se/wp-content/uploads/2021/03/Boo01-500x332.jpg","url":"https://andersson-arfwedson.se/projekt/enbostsadshus-i-nacka/","firm":"Andersson Arfwedson arkitekter AB"},{"name":"Färentuna prästgård","location":"Storstockholm","region":"Stockholm","year":2024,"description":"A residential renovation where the architects lifted the roof by replacing an existing hipped gable roof with a mansard roof, transforming the cramped and dark upper floor into a more spacious and luminous level.","image":"https://andersson-arfwedson.se/wp-content/uploads/2026/04/Front-view-2-500x333.jpg","url":"https://andersson-arfwedson.se/projekt/farentuna-prastgard/","firm":"Andersson Arfwedson arkitekter AB"},{"name":"Herresta, Strängnäs","location":"Strängnäs","region":"Other Sweden","year":"2003","description":"A renovation of a catalog house located in an oak forest near Herrestaviken, featuring a new connecting staircase, remodeled kitchen and bathrooms, ash wood doors with matching trim and baseboards, Höganäs tile flooring, and a Carrara marble kitchen countertop.","image":"https://andersson-arfwedson.se/wp-content/uploads/2023/04/HERRESTA-01-LRES-0073-500x333.jpg","url":"https://andersson-arfwedson.se/projekt/herresta-strangnas/","firm":"Andersson Arfwedson arkitekter AB"},{"name":"Herrviksnäs 1:71","location":"Värmdö, Stockholm","region":"Stockholm","year":2022,"description":"A newly constructed masonry vacation house for three generations on Värmdö featuring an open-plan ground floor with central living room, kitchen, and bedrooms, upper floor with additional bedrooms and sauna, designed to be energy-efficient with year-round standard and without a basement.","image":"https://andersson-arfwedson.se/wp-content/uploads/2025/01/Herrviksnas-1-500x374.jpg","url":"https://andersson-arfwedson.se/projekt/herrviksnas-171/","firm":"Andersson Arfwedson arkitekter AB"},{"name":"Koltrasten 26","location":"Danderyd","region":"Stockholm","year":"2022","description":"A villa designed for a large family on a narrow, steep lot in Danderyd, featuring two half-story-offset volumes connected by a long staircase with full ceiling height, closed facades toward neighboring properties and large windows opening toward southwest views and a private northeast side.","image":"https://andersson-arfwedson.se/wp-content/uploads/2020/06/Edsviksvagen66b_29-500x454.jpg","url":"https://andersson-arfwedson.se/projekt/koltrasten-26/","firm":"Andersson Arfwedson arkitekter AB"},{"name":"Kv. Bensvarvaren 6, Stockholm","location":"Mälarhöjden, Stockholm","region":"Stockholm","year":2002,"description":"A villa extension in Stockholm consisting of a long, single-story addition in brick that screens neighboring properties while opening the home toward the garden, with a glazed staircase tower connecting the existing dining room to the new living room.","image":"https://andersson-arfwedson.se/wp-content/uploads/2021/03/interior_bensvarvaren-334x500.jpg","url":"https://andersson-arfwedson.se/projekt/bensvarvaren-malarhojden/","firm":"Andersson Arfwedson arkitekter AB"},{"name":"Limön 67, Gävle","location":"Gävle","region":"Other Sweden","year":"2012","description":"A summer house on an island outside Gävle designed within strict municipal constraints of 40 square meters, featuring a main building with bedroom and common room with kitchen, a smaller 20-square-meter auxiliary house with bedroom, wood panel facade, and a zinc roof.","image":"https://andersson-arfwedson.se/wp-content/uploads/2021/03/DSCF2470-333x500.jpg","url":"https://andersson-arfwedson.se/projekt/limon-67-gavle/","firm":"Andersson Arfwedson arkitekter AB"},{"name":"Murklan 5","location":"Gamla Enskede, Stockholm","region":"Stockholm","year":null,"description":"A renovation and extension of a villa in a small cottage area, featuring a new generous living room opening to the garden with three tall French doors, redesigned entry with custom storage, and upper floor bedrooms including a master suite with en-suite bathroom and wardrobe overlooking a Japanese garden.","image":"https://andersson-arfwedson.se/wp-content/uploads/2025/01/Hus1_01-500x339.jpg","url":"https://andersson-arfwedson.se/projekt/murklan-5/","firm":"Andersson Arfwedson arkitekter AB"},{"name":"Vitsippan 13, Danderyd","location":"Stocksund, Stockholm","region":"Stockholm","year":"2014","description":"A radically renovated single-family home expanding a 1947 typhus from 90 to 310 square meters through an upper addition with a roof lantern and extensions on the north and west sides, featuring an open two-story central room with skylight and a split-level interior organization connecting to the garden.","image":"https://andersson-arfwedson.se/wp-content/uploads/2021/03/dagmar_021_liten-500x333.jpg","url":"https://andersson-arfwedson.se/projekt/vitsippan-13-danderyd/","firm":"Andersson Arfwedson arkitekter AB"},{"name":"Vättersö 1:98","location":"Vättersö, Stockholm archipelago (Storstockholm)","region":"Stockholm","year":"2011-2012","description":"An extension of a small 1960 concrete stone house with rendered facade and tiled roof, adding a hall and bedroom on the north side at ground level and a new bathroom, with the addition lit by skylights and connected by stairs to the original living areas.","image":"https://andersson-arfwedson.se/wp-content/uploads/2023/08/L1090431-scaled.jpg","url":"https://andersson-arfwedson.se/projekt/vatterso-198/","firm":"Andersson Arfwedson arkitekter AB"},{"name":"Yngsjö","location":"Kristianstads kommun","region":"Skåne","year":"2018","description":"A single-family house designed with modern amenities and the proportions of a traditional Skåne farmhouse, featuring 101 square meters with bedrooms, a separate kitchen, and a large open-plan living and dining room with sloped ceilings on the upper floor.","image":"https://andersson-arfwedson.se/wp-content/uploads/2022/12/yngsjo-exterior-1-500x382.jpg","url":"https://andersson-arfwedson.se/projekt/yngsjo/","firm":"Andersson Arfwedson arkitekter AB"},{"name":"Åstad 8:2, Borgholm","location":"Öland","region":"Other Sweden","year":"2005","description":"A wood-built studio and summer house featuring a central core with bedrooms and a studio, ash wood flooring in main spaces, black-painted exterior paneling with gray sliding shutters, and interior surfaces of gypsum board, plaster, Öland limestone, and tiles.","image":"https://andersson-arfwedson.se/wp-content/uploads/2021/03/Astad_Allrum_Liggande_nr2-500x378.jpg","url":"https://andersson-arfwedson.se/projekt/astad-82-borgholm/","firm":"Andersson Arfwedson arkitekter AB"},{"name":"Ölsta","location":"Färingsö, Stockholm","region":"Stockholm","year":2022,"description":"A small but generously designed guest house featuring an open-plan living area on one half, a two-story section with bedroom, bathroom, workspace and storage, large glazing facing the slope toward the road, and a bedroom with a skylight for stargazing.","image":"https://andersson-arfwedson.se/wp-content/uploads/2026/04/Olsta-front-500x333.jpg","url":"https://andersson-arfwedson.se/projekt/olsta/","firm":"Andersson Arfwedson arkitekter AB"},{"name":"Christinas hus","location":null,"region":"Unspecified","year":null,"description":null,"image":"https://images.squarespace-cdn.com/content/v1/562a8180e4b079feac8c6576/1445679267437-A16NXY4FYC7HKXTN4FU2/bild+5+fix.jpg?format=750w","url":"http://www.lottalander.se/christinas-hus/","firm":"Arkitekt Lotta Lander"},{"name":"Fritidshus och ateljé på Lovön","location":"Lovön","region":"Stockholm","year":null,"description":"A vacation house and studio featuring an iron stove in the dining area, studio spaces with north-facing windows, and views toward a nature reserve.","image":"https://images.squarespace-cdn.com/content/v1/562a8180e4b079feac8c6576/1767361968319-YTKQHTLXTOLT2VMC4C4G/lovon.jpg?format=500w","url":"http://www.lottalander.se/lovon/","firm":"Arkitekt Lotta Lander"},{"name":"Fritidshus på Färingsö","location":"Färingsö","region":"Stockholm","year":null,"description":null,"image":"https://images.squarespace-cdn.com/content/v1/562a8180e4b079feac8c6576/1445865770090-YCHJACVAEQGROHBRFS4U/DSCF5012w.jpg?format=750w","url":"http://www.lottalander.se/fritidshus-pa-faringso/","firm":"Arkitekt Lotta Lander"},{"name":"Fritidshus på Väddö","location":"Väddö","region":"Other Sweden","year":null,"description":null,"image":"https://images.squarespace-cdn.com/content/v1/562a8180e4b079feac8c6576/1665483113420-IRTFH3BUORGY1OC43MJ3/IMG_8916ny.jpg?format=500w","url":"http://www.lottalander.se/vaddo/","firm":"Arkitekt Lotta Lander"},{"name":"Nybyggd skärgårdsidyll","location":null,"region":"Unspecified","year":null,"description":null,"image":"https://images.squarespace-cdn.com/content/v1/562a8180e4b079feac8c6576/1665482439207-8RWDL9BK09STJUBMONB6/IMG_4668.jpg?format=750w","url":"http://www.lottalander.se/loparo/","firm":"Arkitekt Lotta Lander"},{"name":"Villa Lilltorpet","location":null,"region":"Unspecified","year":null,"description":null,"image":"https://images.squarespace-cdn.com/content/v1/562a8180e4b079feac8c6576/1445670315478-YAW9PZ9IA0UEZVT4C9PB/image-asset.jpeg?format=1000w","url":"http://www.lottalander.se/villa-lilltorpet/","firm":"Arkitekt Lotta Lander"},{"name":"Privatbostad Abbekås","location":"Abbekås","region":"Skåne","year":null,"description":"A new-build private residence designed as a multi-generational home.","image":"https://aren-yde.se/wp-content/uploads/2019/08/Privatbostad_Abbeka%CC%8As-1.jpg","url":"https://aren-yde.se/projects-item/abbekas/","firm":"Arkitektkontor Arén & Yde AB"},{"name":"Privatbostad Beddinge","location":"Beddinge, Trelleborg","region":"Skåne","year":null,"description":"A small, functional and modern house featuring high ceilings, optimized daylighting, a semi-enclosed relaxation veranda opening to let state = { category: null, region: null };

function paramCategory() {
  const params = new URLSearchParams(window.location.search);
  const c = params.get("category");
  return CATEGORIES.includes(c) ? c : null;
}

state.category = paramCategory();

function setState(patch) {
  state = { ...state, ...patch };
  render();
}

function resetTo(level) {
  if (level === "root") state = { category: null, region: null };
  if (level === "category") state = { ...state, region: null };
  render();
}

function housesFor(regionOverride) {
  return HOUSES.filter(h => regionOverride === undefined || h.region === regionOverride);
}

function render() {
  renderCrumb();
  renderCategoryRow();

  const regionSection = document.getElementById("region-section");
  const resultsArea = document.getElementById("results-area");

  if (state.category !== "House") {
    regionSection.style.display = "none";
    resultsArea.innerHTML = state.category ? otherCategoryNote(state.category) : "";
    return;
  }

  regionSection.style.display = "block";
  renderRegionRow();
  renderResults();
}

function renderCrumb() {
  const el = document.getElementById("crumb");
  const parts = [{ label: "Work", level: "root" }];
  if (state.category) parts.push({ label: state.category, level: "category" });
  if (state.region) parts.push({ label: state.region, level: "region" });

  el.innerHTML = parts.map((p, i) => {
    const isLast = i === parts.length - 1;
    const seg = isLast
      ? `<span class="crumb-current">${p.label}</span>`
      : `<button onclick="resetTo('${p.level}')">${p.label}</button>`;
    return (i > 0 ? `<span class="sep">/</span>` : "") + seg;
  }).join(" ");
}

function renderCategoryRow() {
  const el = document.getElementById("category-row");
  el.innerHTML = `<div class="step-label">Category</div>` + CATEGORIES.map(c => {
    const active = state.category === c ? "active" : "";
    return `<button class="chip ${active}" onclick="selectCategory('${c}')">${c}</button>`;
  }).join("");
}

function selectCategory(c) {
  if (state.category === c) return;
  setState({ category: c, region: null });
}

function renderRegionRow() {
  const el = document.getElementById("region-row");
  const regions = [...new Set(housesFor(undefined).map(h => h.region))]
    .sort((a, b) => housesFor(b).length - housesFor(a).length);
  el.innerHTML = `<div class="step-label">Location</div>` +
    `<button class="chip ${!state.region ? "active" : ""}" onclick="selectRegion(null)">All houses <span class="count">${housesFor(undefined).length}</span></button>` +
    regions.map(r => {
      const count = housesFor(r).length;
      const active = state.region === r ? "active" : "";
      return `<button class="chip ${active}" onclick="selectRegion('${r}')">${r} <span class="count">${count}</span></button>`;
    }).join("");
}

function selectRegion(r) {
  setState({ region: r });
}

function renderResults() {
  const matches = housesFor(state.region || undefined);
  const el = document.getElementById("results-area");
  if (matches.length === 0) {
    el.innerHTML = `<p class="empty-state">No houses match this combination yet.</p>`;
    return;
  }
  el.innerHTML = `<p class="result-count">${matches.length} house${matches.length === 1 ? "" : "s"}</p>` +
    `<div class="results-grid">` +
    matches.map(h => `
      <a class="house-card" href="${h.url}" target="_blank" rel="noopener">
        <div class="house-photo"><img src="${h.image}" alt="${h.name || "House"}" loading="lazy"></div>
        <p class="house-name">${h.name || "Untitled house"}</p>
        <p class="house-meta">${[h.location, h.year].filter(Boolean).join(" · ")}</p>
        <p class="house-credit">Designed by ${h.firm}</p>
      </a>
    `).join("") +
    `</div>`;
}

function otherCategoryNote(cat) {
  const page = CATEGORY_PAGES[cat];
  return `<div class="other-category-note">
    <strong>${cat}</strong> browsing already exists as its own real, live page today.
    This page only wires up House's sequential Category → Location refinement — whether
    ${cat} gets its own further chip refinement (e.g. by material) is a separate,
    not-yet-decided question.<br><br>
    <a href="${page}">View the real ${cat} page →</a>
  </div>`;
}

render();
</script>
