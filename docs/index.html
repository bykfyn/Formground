<style>
  :root {
    --bg: #faf9f7;
    --surface-1: #f1efec;
    --surface-2: #ffffff;
    --text-primary: #1c1b1a;
    --text-secondary: #57534e;
    --text-muted: #948d85;
    --text-accent: #4a6670;
    --border: #e4e0da;
    --border-accent: #4a6670;
    --border-strong: #c9c2b8;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 1160px;
    margin: 0 auto;
    padding: 24px 20px 28px;
  }

  .search-wide {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
  }

  /* --- site header --- */
  /* Stacked Hay-style layout - logo centered on top, nav centered below,
     no dividing line - mirrors the shared site.css rule used on every
     other page (see that file's own comment); index.html keeps its own
     copy since it doesn't link site.css. margin-bottom: 0, not the 40px
     every other page uses, because the search box below is meant to sit
     as close to the header as work.html's own ask-box does. */
  .site-header {
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    padding: 32px 0 20px;
  }
  .site-header .wordmark { height: 44px; width: auto; display: block; }
  .top-nav {
    display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 22px;
  }
  .top-nav a {
    font-size: 12px; line-height: 16px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-secondary); text-decoration: none; padding-bottom: 2px;
    border-bottom: 1.5px solid transparent;
  }
  .top-nav a:hover { color: var(--text-primary); }

  /* Visually hidden but still readable by search engines/screen readers -
     the wordmark carries the page visually, but the page still needs a
     real h1 for SEO/accessibility. */
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  /* --- browse by category --- */
  /* Matches work.html's own ask-box -> results rhythm exactly (32px to
     this label, 20px from label to grid) so browsing by category reads
     as the same kind of thing as a set of search results, just below
     the same search box, not a separately-paced section. */
  .browse-label {
    text-align: center; font-size: 12px; color: var(--text-muted);
    margin: 32px 0 20px; text-transform: uppercase; letter-spacing: 0.08em;
  }
  /* 2x2, not a single row - now that there are only 4 categories
     (Ceramics folded into Objects, see project memory), each tile can
     be much larger and more editorial (reference: Hay/Vitra category
     pages) than the old 5-across row of small squares. */
  /* max-width: 760px, not the full 1120px content width - at full width
     each tile came out ~550px wide (~412px tall, 4:3), which pushed the
     second row (Lighting/Objects) almost entirely below the fold on a
     laptop-height viewport (confirmed live 2026-09-20 at 1280x800: row
     2 started at y=748, only 51px visible above the 800px fold - see
     project memory). At 760px, each tile is ~370px wide/~278px tall,
     and row 2 starts around y=616 - more than half visible on the same
     viewport, still noticeably bigger than the original 5-across
     200px-tile row this replaced. */
  .category-grid {
    display: grid; grid-template-columns: 1fr 1fr; max-width: 760px;
    gap: 20px; margin: 0 auto 40px;
  }
  .category-grid figure { margin: 0; }
  .category-grid a {
    display: block; text-decoration: none; color: inherit;
  }
  /* Sharp corners, not var(--radius) - a deliberately more angular,
     architectural look for these specifically, since they're real
     building/product photography rather than UI chrome like the ask-box. */
  .cat-photo {
    aspect-ratio: 4/3; overflow: hidden;
    background: var(--surface-1); margin: 0 0 14px; border: 0.5px solid var(--border);
  }
  .cat-photo img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
  .cat-photo img.contain-fit { object-fit: contain; }
  .category-grid a:hover .cat-photo img { transform: scale(1.02); }
  /* font-size scales continuously with viewport width (not a fixed px
     value), not just at breakpoints, so the caption tracks each tile's
     own real size as the page resizes (2026-09-20, see project memory).
     Tried container query units (cqw) first, sized off each figure's
     own width directly - hit a real bug in this browser where
     `container-type: inline-size` collapsed every grid item to 0 width
     even with an explicit width set, so this uses the equivalent linear
     relationship in vw instead (derived from the grid's own math: tile
     width = 0.5*viewport - 30px below the grid's 760px cap, so
     font-size = 2.7vw - 1.62px keeps the same ~5.4% ratio to tile width
     that the cqw version targeted). Clamped so it never gets unreadably
     small on a narrow screen or exceeds the original 20px design size
     (reached once the grid hits its 760px cap, around 800px viewport). */
  .cat-name {
    font-family: 'Archivo', sans-serif; font-weight: 700;
    font-size: clamp(13px, calc(2.7vw - 1.62px), 20px);
    letter-spacing: -0.005em; margin: 0; color: var(--text-primary);
  }

  /* --- search --- */
  .ask-box {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface-1); border: 0.5px solid var(--border);
    border-radius: var(--radius); padding: 13px 16px;
  }
  .ask-box i.ti-search { font-size: 18px; color: var(--text-muted); }
  .ask-box input {
    border: none; background: none; outline: none; flex: 1;
    font-size: 15px; color: var(--text-primary); font-family: inherit;
  }
  .ask-box input::placeholder { color: var(--text-muted); }

  .inline-chip {
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    font-size: 13px; color: var(--text-secondary); font-family: inherit;
    background: var(--surface-2); border: 0.5px solid var(--border-strong);
    padding: 7px 12px; margin: 0;
    cursor: pointer; border-radius: 8px; white-space: nowrap;
  }
  .inline-chip:hover { border-color: var(--text-muted); }
  .inline-chip i { font-size: 15px; }

  /* Stacks to one column, same breakpoint as creators.html's group-grid
     (2026-09-20, see project memory) - full-width tiles read better on
     a small screen than two cramped columns, consistent with how
     Creators already collapses. */
  @media (max-width: 760px) {
    .category-grid { grid-template-columns: 1fr; }
  }

  @media (max-width: 480px) {
    .inline-chip span { display: none; }
    .inline-chip { padding: 9px; }
  }

  /* --- footer --- */
  /* color is --text-secondary, not --text-muted - fails WCAG contrast
     against --bg otherwise (confirmed via Lighthouse), and this is
     real navigation, not decorative chrome. margin-top: auto pushes it
     to the bottom of `main` (a flex column, itself flex:1 in the
     full-height body) instead of sitting right under the search box. */
  .foot-note {
    font-size: 11px; color: var(--text-secondary); text-align: center;
    margin-top: 160px; padding-top: 28px; line-height: 1.6;
    border-top: 0.5px solid var(--border);
  }
  .foot-note a { color: var(--text-secondary); }
  .foot-note a:hover { color: var(--text-primary); }
</style>

<main>

        <button type="button" class="inline-chip" id="discover-chip" aria-label="Surprise me"><i class="ti ti-arrows-shuffle" aria-hidden="true"></i><span>Surprise me</span></button>

  <p class="browse-label">Or browse by category</p>
  <section class="category-grid">
    <figure style="margin:0;">
      <a href="work.html?q=house">
        <div class="cat-photo"><img src="https://images.squarespace-cdn.com/content/v1/58c8008a37c581e1410f405f/1568234543576-KXHFL0JLQZG65C4EL2IE/anlita-arkitekt-bjorn-lundquist-arkitektur-villa-h-02.jpg?format=1500w" alt="H House by Björn Lundquist Arkitektur AB" loading="lazy"></div>

      </a>
    </figure>
    <figure style="margin:0;">
      <a href="work.html?q=furniture">
        <div class="cat-photo"><img src="https://verk.se/wp-content/uploads/2023/02/Karmstol-V.EU_.01-1-1680x1831-1-860x937.jpg" alt="Armchair V.EU.01 by Verk" loading="lazy"></div>
        <p class="cat-name">Furniture</p>
      </a>
    </figure>
    <figure style="margin:0;">
      <a href="work.html?q=lighting">

        <p class="cat-name">Lighting</p>
      </a>
    </figure>
    <figure style="margin:0;">
      <a href="work.html?q=objects">
        <div class="cat-photo"><img src="https://cdn.shopify.com/s/files/1/0593/6984/9030/files/OOCI_MediumRosso_INV_00000_01.webp?v=1743690417" alt="Vaso by Bitossi Ceramiche" loading="lazy"></div>

  <p class="foot-note">
    &copy; 2026 Formground &middot; <a href="privacy.html">Privacy</a>
  </p>

<script src="search.js"></script>
<script>
  // Fixed, hand-verified images, not a random rotation pool - a prior
  // version rotated through several real per-category product photos,
  // but the pool was built from generate_brand_pages.py's
  // umbrella_categories_for(), which (confirmed 2026-09-19) has a real
  // false-positive bug: a product like Minimalux's "Stem" table lamp
  // gets classified into *both* Furniture (via the word "table" in its
  // "Table Lamps" category tag) and Lighting, so the Furniture tile
  // could show a lamp. Rather than trust that classifier for what's
  // effectively the site's own visual definition of each category,
  // each image here was opened and looked at directly before being
  // picked - see project memory for the broader umbrella_categories_for
  // bug, which still needs its own fix independent of this page.
  document.querySelectorAll(".category-grid .cat-photo img").forEach(function (img) {
    img.addEventListener("load", function () {
      var ratio = img.naturalWidth / img.naturalHeight;
      img.classList.toggle("contain-fit", ratio < 0.55 || ratio > 1.8);
    });
  });
</script>
