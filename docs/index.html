<style>
  :root {
    --bg: #faf9f7;
    --surface-1: #f1efec;
    --surface-2: #ffffff;
    --text-primary: #1c1b1a;
    --text-secondary: #57534e;
    --text-muted: #948d85;
    --text-accent: #4a6670;
    --border: #e4e0da;
    --border-accent: #4a6670;
    --border-strong: #c9c2b8;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 1160px;
    margin: 0 auto;
    padding: 24px 20px 28px;
  }

  .search-wide {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
  }

  /* --- site header --- */
  /* Stacked Hay-style layout - logo centered on top, nav centered below,
     no dividing line - mirrors the shared site.css rule used on every
     other page (see that file's own comment); index.html keeps its own
     copy since it doesn't link site.css. margin-bottom: 0, not the 40px
     every other page uses, because the search box below is meant to sit
     as close to the header as work.html's own ask-box does. */
  .site-header {
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    padding: 32px 0 20px;
  }
  .site-header .wordmark { height: 44px; width: auto; display: block; }
  .top-nav {
    display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 22px;
  }
  .top-nav a {
    font-size: 12px; line-height: 16px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-secondary); text-decoration: none; padding-bottom: 2px;
    border-bottom: 1.5px solid transparent;
  }
  .top-nav a:hover { color: var(--text-primary); }

  /* Visually hidden but still readable by search engines/screen readers -
     the wordmark carries the page visually, but the page still needs a
     real h1 for SEO/accessibility. */
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  /* --- browse by category --- */
  /* Matches work.html's own ask-box -> results rhythm exactly (32px to
     this label, 20px from label to grid) so browsing by category reads
     as the same kind of thing as a set of search results, just below
     the same search box, not a separately-paced section. */
  .browse-label {
    text-align: center; font-size: 12px; color: var(--text-muted);
    margin: 32px 0 20px; text-transform: uppercase; letter-spacing: 0.08em;
  }
  /* Bento-style asymmetric grid: Houses is a tall hero, Objects/Lighting
     are small squares, Furniture is a wide strip - real visual variety
     instead of 4 identical squares (2026-09-20, replacing the uniform
     2x2 grid; see project memory). Each tile now also carries a
     hover-reveal (product name + maker) and a real external "visit
     source" link, sibling to - not nested inside - the internal
     category link (nested <a> tags are invalid HTML; same pattern as
     work.html's own share-btn). */
  .category-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 20px;
    height: 560px;
    margin: 0 0 40px;
  }
  .tile-houses { grid-column: 1; grid-row: 1 / 3; }
  .tile-objects { grid-column: 2; grid-row: 1; }
  .tile-lighting { grid-column: 3; grid-row: 1; }
  .tile-furniture { grid-column: 2 / 4; grid-row: 2; }

  .cat-tile {
    position: relative; display: block; overflow: hidden;
    border: 0.5px solid var(--border); background: var(--surface-1);
    height: 100%; margin: 0;
  }
  .cat-tile img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform 0.4s ease;
  }
  .cat-tile:hover img { transform: scale(1.03); }

  /* The internal "browse this category" link - a sibling to the
     external visit-source link below, not a wrapper around the whole
     figure, so the two links can't end up nested (invalid HTML). */
  .cat-link { position: absolute; inset: 0; z-index: 1; }

  /* Category label - always visible, solid chip with no shadow/blur -
     some tiles are dark photography (Houses, Lighting), others
     near-white product shots (Objects, Furniture), and a text-shadow
     strong enough to read on the light ones looked like a smudge on the
     dark ones (2026-09-20, see project memory). */
  .cat-label {
    position: absolute; top: 16px; left: 16px; z-index: 2;
    font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 13.5px;
    color: var(--text-primary); letter-spacing: -0.005em;
    background: #fff; padding: 6px 11px; margin: 0;
    pointer-events: none;
  }

  /* Hover reveal - product name + maker, bottom gradient scrim. */
  .cat-details {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    padding: 28px 16px 14px;
    background: linear-gradient(to top, rgba(0,0,0,0.68), rgba(0,0,0,0));
    color: #fff;
    opacity: 0; transform: translateY(6px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
  }
  .cat-tile:hover .cat-details { opacity: 1; transform: translateY(0); }
  .cat-details .product-name { display: block; font-size: 13.5px; font-weight: 600; margin: 0 0 2px; }
  .cat-details .product-maker { display: block; font-size: 12px; opacity: 0.85; }

  /* External "visit source" link - keeps the same promise every search
     result elsewhere on the site makes (link straight back to the real
     maker/architect), even from the homepage's own category tiles.
     Sibling to .cat-link, not nested inside it. */
  .visit-source {
    position: absolute; bottom: 12px; right: 12px; z-index: 3;
    display: flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600; color: #fff;
    background: rgba(255,255,255,0.16); border: 0.5px solid rgba(255,255,255,0.4);
    backdrop-filter: blur(4px);
    padding: 6px 10px; border-radius: 999px; text-decoration: none;
    opacity: 0; transform: translateY(6px);
    transition: opacity 0.25s ease, transform 0.25s ease, background 0.15s ease;
  }
  .cat-tile:hover .visit-source { opacity: 1; transform: translateY(0); }
  .visit-source:hover { background: rgba(255,255,255,0.3); }
  .visit-source i { font-size: 13px; }

  /* --- search --- */
  .ask-box {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface-1); border: 0.5px solid var(--border);
    border-radius: var(--radius); padding: 13px 16px;
  }
  .ask-box i.ti-search { font-size: 18px; color: var(--text-muted); }
  .ask-box input {
    border: none; background: none; outline: none; flex: 1;
    font-size: 15px; color: var(--text-primary); font-family: inherit;
  }
  .ask-box input::placeholder { color: var(--text-muted); }

  .inline-chip {
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    font-size: 13px; color: var(--text-secondary); font-family: inherit;
    background: var(--surface-2); border: 0.5px solid var(--border-strong);
    padding: 7px 12px; margin: 0;
    cursor: pointer; border-radius: 8px; white-space: nowrap;
  }
  .inline-chip:hover { border-color: var(--text-muted); }
  .inline-chip i { font-size: 15px; }

  /* Stacks full-width, same breakpoint as creators.html's group-grid
     (2026-09-20, see project memory) - the fixed-height bento layout
     doesn't translate to a narrow screen, so each tile becomes its own
     full-width 4:3 photo instead. Hover never fires on touch, so the
     product name/maker and visit-source link are always shown here
     rather than only on hover. */
  @media (max-width: 760px) {
    .category-grid { display: flex; flex-direction: column; height: auto; gap: 16px; }
    .cat-tile { aspect-ratio: 4 / 3; }
    .cat-details, .visit-source { opacity: 1; transform: none; pointer-events: auto; }
  }

  @media (max-width: 480px) {
    .inline-chip span { display: none; }
    .inline-chip { padding: 9px; }
  }

  /* --- footer --- */
  /* color is --text-secondary, not --text-muted - fails WCAG contrast
     against --bg otherwise (confirmed via Lighthouse), and this is
     real navigation, not decorative chrome. margin-top: auto pushes it
     to the bottom of `main` (a flex column, itself flex:1 in the
     full-height body) instead of sitting right under the search box. */
  .foot-note {
    font-size: 11px; color: var(--text-secondary); text-align: center;
    margin-top: 160px; padding-top: 28px; line-height: 1.6;
    border-top: 0.5px solid var(--border);
  }
  .foot-note a { color: var(--text-secondary); }
  .foot-note a:hover { color: var(--text-primary); }
</style>
</head>
