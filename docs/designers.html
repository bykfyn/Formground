<style>
  /* Pins the footer to the bottom of the viewport even when the page
     itself is short (no real content yet, just the coming-soon
     notice) - without this, .foot-note's fixed 60px top margin (see
     site.css) just sits right under a short page's content instead of
     reading as a real page foot. body becomes the full-height flex
     column, main is the one child that grows to fill it, and the
     footer's margin-top: auto (overriding site.css's fixed 60px, only
     on this page) pushes itself to the bottom of that remaining
     space. */
  body { min-height: 100vh; display: flex; flex-direction: column; }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 1160px;
    margin: 0 auto;
    padding: 24px 20px 60px;
    width: 100%;
  }
  .site-header { margin-bottom: 0; }
  .foot-note { margin-top: auto; }

  /* Same ask-box look, width and hero position as architects.html/
     makers.html - a search box that lands in the identical spot on
     every directory-style page (see project memory). Disabled rather
     than wired to a live filter, matching the notify-row below it -
     there's no real grid to filter yet, so an interactive box would
     promise something this page can't do. */
  .search-wide { width: 100%; max-width: 900px; margin: 0 auto 32px; }
  .ask-box {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface-1); border: 0.5px solid var(--border);
    border-radius: var(--radius); padding: 13px 16px;
  }
  .ask-box i.ti-search { font-size: 18px; color: var(--text-muted); }
  .ask-box input {
    border: none; background: none; outline: none; flex: 1;
    font-size: 15px; color: var(--text-primary); font-family: inherit;
  }
  .ask-box input::placeholder { color: var(--text-muted); }
  .ask-box-context {
    flex-shrink: 0; font-size: 13px; font-weight: 600; color: var(--text-secondary);
    background: var(--surface-2); border: 0.5px solid var(--border-strong);
    padding: 7px 10px; border-radius: 999px;
  }

  /* Stands in for the maker-grid architects.html/makers.html would
     show here - centered, since there's a single message rather than
     a scannable list of cards. */
  .coming-soon-notice { max-width: 480px; margin: 100px auto 0; text-align: center; }
  .coming-soon-notice p {
    font-size: 14.5px; color: var(--text-secondary); line-height: 1.65; margin: 0;
  }

  .notify-row {
    display: flex; justify-content: center; gap: 10px; margin: 22px auto 0; max-width: 380px;
  }
  .notify-row input {
    flex: 1; border: 0.5px solid var(--border-strong); border-radius: 8px;
    padding: 10px 14px; font-size: 13.5px; font-family: inherit; background: var(--surface-2);
  }
  /* Pill-shaped like every other chip on the site (the ask-box-context
     chip above, marketplace.html's category chips) - the button here
     was a squared-off 8px-radius rectangle before, out of step with
     that shared shape language even though it's a primary action
     rather than a passive filter. */
  .notify-row button {
    font: inherit; font-size: 13.5px; font-weight: 600; color: #fff;
    background: var(--text-primary); border: none; border-radius: 999px;
    padding: 10px 20px; cursor: pointer; white-space: nowrap;
  }
</style>

      <i class="ti ti-search" aria-hidden="true"></i>
      <span class="ask-box-context">Designers</span>
      <input type="text" placeholder="Filter by name or category" disabled>
    </div>
  </div>
  <h1 class="sr-only">Designers</h1>

  <div class="coming-soon-notice">
    <p>We're building this out now. Designers will get their own discoverable profiles soon.</p>
    <div class="notify-row">
      <input type="text" placeholder="you@email.com" disabled>
      <button type="button" disabled>Notify me</button>
    </div>
  </div>

  </p>
</main>
