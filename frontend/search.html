<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search — Formground</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="description" content="Discover furniture, lighting, ceramics, and objects from independent makers. No accounts, no rankings - every result links straight back to the source.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css">
<style>
  :root {
    --bg: #faf9f7;
    --surface-1: #f1efec;
    --surface-2: #ffffff;
    --text-primary: #1c1b1a;
    --text-secondary: #57534e;
    --text-muted: #948d85;
    --text-accent: #4a6670;
    --border: #e4e0da;
    --border-accent: #4a6670;
    --border-strong: #c9c2b8;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 8vh 20px 40px;
  }

  .search-column {
    max-width: 640px;
    margin: 0 auto;
  }
  .search-wide {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
  }

  /* --- header --- */
  .brand-header { text-align: center; margin-bottom: 28px; }
  .brand-header a { display: inline-block; text-decoration: none; }
  .brand-header .wordmark {
    height: 44px; width: auto;
    margin: 0 0 10px;
  }

  /* --- ask box --- */
  .ask-box {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface-1); border: 0.5px solid var(--border);
    border-radius: var(--radius); padding: 13px 16px; margin-top: 0;
  }
  .ask-box i.ti-search { font-size: 18px; color: var(--text-muted); }
  .ask-box input {
    border: none; background: none; outline: none; flex: 1;
    font-size: 15px; color: var(--text-primary); font-family: inherit;
  }
  .ask-box input::placeholder { color: var(--text-muted); }

  .inline-chip {
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    font-size: 13px; color: var(--text-secondary); font-family: inherit;
    background: var(--surface-2); border: 0.5px solid var(--border-strong);
    padding: 7px 12px; margin: 0;
    cursor: pointer; border-radius: 8px; white-space: nowrap;
  }
  .inline-chip:hover { border-color: var(--text-muted); }
  .inline-chip i { font-size: 15px; }

  @media (max-width: 480px) {
    .inline-chip span { display: none; }
    .inline-chip { padding: 9px; }
  }

  /* --- results --- */
  #results-meta {
    font-size: 12px; color: var(--text-muted); text-align: center;
    margin: 32px 0 20px; display: none;
  }
  .results-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
  }
  .card {
    background: var(--surface-2); border: 0.5px solid var(--border);
    border-radius: 12px; overflow: hidden; text-decoration: none; color: inherit;
    display: block; position: relative;
  }
  .card.thin { border-style: dashed; border-color: var(--border-strong); }
  .card-image {
    aspect-ratio: 1 / 1; background: var(--surface-1);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .card-image i { font-size: 28px; color: var(--text-muted); }
  .card-image img { width: 100%; height: 100%; object-fit: cover; }
  .card-image img.contain-fit { object-fit: contain; }
  .card-body { padding: 10px 32px 10px 12px; position: relative; }
  .share-btn {
    position: absolute; bottom: 6px; right: 6px; z-index: 1;
    width: 24px; height: 24px; border-radius: 50%; border: none;
    background: transparent; color: var(--text-muted);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
  }
  .share-btn:hover { background: var(--surface-1); color: var(--text-primary); }
  .share-btn i { font-size: 14px; }
  .share-btn.copied::after {
    content: "Copied"; position: absolute; bottom: 30px; right: 0;
    background: var(--text-primary); color: var(--surface-2);
    font-size: 11px; padding: 3px 8px; border-radius: 6px; white-space: nowrap;
  }
  .card-title-wrap { min-height: 2.6em; display: flex; align-items: center; }
  .card-title {
    font-size: 13px; font-weight: 500; margin: 0; line-height: 1.3;
    display: -webkit-box; -webkit-box-orient: vertical;
    -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden;
  }
  .card-brand {
    font-size: 12px; color: var(--text-secondary); margin: 2px 0 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-detail {
    font-size: 11px; color: var(--text-muted); margin: 0; line-height: 1.3; min-height: 1.3em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-note {
    font-size: 11px; color: var(--text-accent); margin: 0; line-height: 1.3; min-height: 1.3em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-note i { font-size: 12px; vertical-align: -1px; margin-right: 3px; }

  /* --- footer / empty state / errors --- */
  .foot-note {
    font-size: 11px; color: var(--text-muted); text-align: center;
    margin-top: auto; padding-top: 24px; line-height: 1.6;
    border-top: 0.5px solid var(--border);
  }
  .foot-note a { color: var(--text-muted); }
  .foot-note a:hover { color: var(--text-secondary); }
  #status { font-size: 13px; color: var(--text-muted); text-align: center; margin: 32px 0; display: none; }
  #status.error { color: #a14b3f; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<main>
  <div class="search-column">
    <div class="brand-header">
      <a href="/"><img class="wordmark" src="logo/formground_logotype_RGB.png" alt="Formground"></a>
    </div>
  </div>

  <div class="search-wide">
    <form id="search-form">
      <div class="ask-box">
        <i class="ti ti-search" aria-hidden="true"></i>
        <input id="query-input" type="text" placeholder="furniture, lighting, objects — describe what you're looking for" autocomplete="off">
        <button type="button" class="inline-chip" id="discover-chip" aria-label="Surprise me"><i class="ti ti-arrows-shuffle" aria-hidden="true"></i><span>Surprise me</span></button>
      </div>
    </form>
  </div>

  <p id="status"></p>
  <p id="results-meta"></p>
  <div id="results-grid" class="results-grid"></div>

  <p class="foot-note">
    From a curated collection, equally relevant results are shown in
    random order and link straight to each maker's own site.<br>
    No paid results. No account needed.<br>
    <a href="about.html">About Formground</a> &middot; <a href="makers.html">Makers</a> &middot; <a href="resources.html">Resources</a> &middot; <a href="contact.html">Get in touch</a>
  </p>
</main>

<script src="search.js"></script>

</body>
</html>
