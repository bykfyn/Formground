<style>
  :root {
    --bg: #faf9f7;
    --surface-1: #f1efec;
    --surface-2: #ffffff;
    --text-primary: #1c1b1a;
    --text-secondary: #57534e;
    --text-muted: #948d85;
    --text-accent: #4a6670;
    --border: #e4e0da;
    --border-accent: #4a6670;
    --border-strong: #c9c2b8;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 1160px;
    margin: 0 auto;
    padding: 0 20px 28px;
  }

  .search-wide {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
  }

  /* --- site header --- */
  .site-header {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px 24px;
    padding: 28px 0; margin-bottom: 64px; border-bottom: 1px solid var(--border);
  }
  .site-header .wordmark { height: 28px; width: auto; display: block; }
  .top-nav {
    display: flex; flex-wrap: wrap; gap: 8px 20px;
  }
  .top-nav a {
    font-size: 13px; color: var(--text-secondary); text-decoration: none;
  }
  .top-nav a:hover { color: var(--text-primary); }

  /* Visually hidden but still readable by search engines/screen readers -
     the wordmark carries the page visually, but the page still needs a
     real h1 for SEO/accessibility. */
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  /* --- category grid --- */
  /* Flex, not grid - an odd number of cards (5) means the last row is
     sometimes a partial row (e.g. 3+2 at tablet widths), and flex with
     justify-content:center naturally centers that leftover row, where
     grid's auto-fit tracks would leave it stuck to the left edge instead. */
  .category-grid {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 20px; margin: 100px 0 40px;
  }
  /* Fixed size on the figure (the actual flex item, since each figure
     wraps its own rotating <a>), not flex-grow - a lone leftover item
     on its own row would otherwise stretch to fill that row's space,
     making it bigger than its siblings above. Every card stays the
     same size regardless of how many share its row; flex-wrap +
     justify-content:center still centers a partial row. */
  .category-grid figure { flex: 0 0 200px; margin: 0; }
  .category-grid a {
    display: block; text-decoration: none; color: inherit;
  }
  .cat-photo {
    aspect-ratio: 4/3; border-radius: var(--radius); overflow: hidden;
    background: var(--surface-1); margin: 0 0 12px; border: 0.5px solid var(--border);
  }
  .cat-photo img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s ease; }
  .cat-photo img.contain-fit { object-fit: contain; }
  .category-grid a:hover .cat-photo img { transform: scale(1.03); }
  .cat-name {
    font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 15px;
    letter-spacing: -0.005em; margin: 0; color: var(--text-primary); text-align: center;
  }

  /* --- search --- */
  .ask-box {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface-1); border: 0.5px solid var(--border);
    border-radius: var(--radius); padding: 13px 16px;
  }
  .ask-box i.ti-search { font-size: 18px; color: var(--text-muted); }
  .ask-box input {
    border: none; background: none; outline: none; flex: 1;
    font-size: 15px; color: var(--text-primary); font-family: inherit;
  }
  .ask-box input::placeholder { color: var(--text-muted); }

  .inline-chip {
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    font-size: 13px; color: var(--text-secondary); font-family: inherit;
    background: var(--surface-2); border: 0.5px solid var(--border-strong);
    padding: 7px 12px; margin: 0;
    cursor: pointer; border-radius: 8px; white-space: nowrap;
  }
  .inline-chip:hover { border-color: var(--text-muted); }
  .inline-chip i { font-size: 15px; }

  @media (max-width: 480px) {
    .inline-chip span { display: none; }
    .inline-chip { padding: 9px; }
  }

  /* --- footer --- */
  /* color is --text-secondary, not --text-muted - fails WCAG contrast
     against --bg otherwise (confirmed via Lighthouse), and this is
     real navigation, not decorative chrome. margin-top: auto pushes it
     to the bottom of `main` (a flex column, itself flex:1 in the
     full-height body) instead of sitting right under the search box. */
  .foot-note {
    font-size: 11px; color: var(--text-secondary); text-align: center;
    margin-top: 160px; padding-top: 28px; line-height: 1.6;
    border-top: 0.5px solid var(--border);
  }
  .foot-note a { color: var(--text-secondary); }
  .foot-note a:hover { color: var(--text-primary); }
</style>

<script src="search.js"></script>
<script>
  // Fixed, hand-verified images, not a random rotation pool - a prior
  // version rotated through several real per-category product photos,
  // but the pool was built from generate_brand_pages.py's
  // umbrella_categories_for(), which (confirmed 2026-09-19) has a real
  // false-positive bug: a product like Minimalux's "Stem" table lamp
  // gets classified into *both* Furniture (via the word "table" in its
  // "Table Lamps" category tag) and Lighting, so the Furniture tile
  // could show a lamp. Rather than trust that classifier for what's
  // effectively the site's own visual definition of each category,
  // each image here was opened and looked at directly before being
  // picked - see project memory for the broader umbrella_categories_for
  // bug, which still needs its own fix independent of this page.
  document.querySelectorAll(".category-grid .cat-photo img").forEach(function (img) {
    img.addEventListener("load", function () {
      var ratio = img.naturalWidth / img.naturalHeight;
      img.classList.toggle("contain-fit", ratio < 0.55 || ratio > 1.8);
    });
  });
</script>
