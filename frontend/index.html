<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formground</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css">
<style>
  :root {
    --bg: #faf9f7;
    --surface-1: #f1efec;
    --surface-2: #ffffff;
    --text-primary: #1c1b1a;
    --text-secondary: #57534e;
    --text-muted: #948d85;
    --text-accent: #4a6670;
    --border: #e4e0da;
    --border-accent: #4a6670;
    --border-strong: #c9c2b8;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 14vh 20px 40px;
  }

  .search-column {
    max-width: 640px;
    margin: 0 auto;
  }
  .search-wide {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
  }

  /* --- header --- */
  .brand-header { text-align: center; margin-bottom: 28px; }
  .brand-header .wordmark {
    height: 44px; width: auto;
    margin: 0 0 10px;
  }
  .brand-header .tagline { font-size: 13px; color: var(--text-secondary); margin: 0 0 4px; }

  /* --- ask box --- */
  .ask-box {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface-1); border: 0.5px solid var(--border);
    border-radius: var(--radius); padding: 13px 16px; margin-top: 28px;
  }
  .ask-box i.ti-search { font-size: 18px; color: var(--text-muted); }
  .ask-box input {
    border: none; background: none; outline: none; flex: 1;
    font-size: 15px; color: var(--text-primary); font-family: inherit;
  }
  .ask-box input::placeholder { color: var(--text-muted); }

  .inline-chip {
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    font-size: 13px; color: var(--text-secondary); font-family: inherit;
    background: var(--surface-2); border: 0.5px solid var(--border-strong);
    padding: 7px 12px; margin: 0;
    cursor: pointer; border-radius: 8px; white-space: nowrap;
  }
  .inline-chip:hover { border-color: var(--text-muted); }
  .inline-chip i { font-size: 15px; }

  @media (max-width: 480px) {
    .inline-chip span { display: none; }
    .inline-chip { padding: 9px; }
  }

  /* --- results --- */
  #results-meta {
    font-size: 12px; color: var(--text-muted); text-align: center;
    margin: 32px 0 20px; display: none;
  }
  .results-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
  }
  .card {
    background: var(--surface-2); border: 0.5px solid var(--border);
    border-radius: 12px; overflow: hidden; text-decoration: none; color: inherit;
    display: block;
  }
  .card.thin { border-style: dashed; border-color: var(--border-strong); }
  .card-image {
    aspect-ratio: 1 / 1; background: var(--surface-1);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .card-image i { font-size: 28px; color: var(--text-muted); }
  .card-image img { width: 100%; height: 100%; object-fit: cover; }
  .card-body { padding: 10px 12px; }
  .card-title { font-size: 13px; font-weight: 500; margin: 0; }
  .card-brand { font-size: 12px; color: var(--text-secondary); margin: 2px 0 6px; }
  .card-detail { font-size: 11px; color: var(--text-muted); margin: 0; }
  .card-note { font-size: 11px; color: var(--text-accent); margin: 0; }
  .card-note i { font-size: 12px; vertical-align: -1px; margin-right: 3px; }

  /* --- footer / empty state / errors --- */
  .foot-note {
    font-size: 11px; color: var(--text-muted); text-align: center;
    margin-top: auto; padding-top: 24px; line-height: 1.6;
    border-top: 0.5px solid var(--border);
  }
  .foot-note a { color: var(--text-muted); }
  .foot-note a:hover { color: var(--text-secondary); }
  #status { font-size: 13px; color: var(--text-muted); text-align: center; margin: 32px 0; display: none; }
  #status.error { color: #a14b3f; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<main>
  <div class="search-column">
    <div class="brand-header">
      <img class="wordmark" src="logo/formground_logotype_RGB.png" alt="Formground">
      <p class="tagline">A way to discover design from independent makers.</p>
    </div>
  </div>

  <!-- Category browse chips (Chairs/Lighting/Ceramics/Tables) were
       removed on purpose, not just deferred - see project memory
       product_interface_decisions.md. The taxonomy across the 16
       brands' own category data is too inconsistent (mixed levels,
       different languages, missing tags on some brands) to guarantee a
       "healthy" result count for every chip, and a browse affordance
       that sometimes returns 3 results from one brand reads as broken.
       Normal search doesn't have this problem since a real query only
       needs to match well, not comprehensively, for every possible
       category. -->
  <div class="search-wide">
    <form id="search-form">
      <div class="ask-box">
        <i class="ti ti-search" aria-hidden="true"></i>
        <input id="query-input" type="text" placeholder="furniture, lighting, objects — describe what you're looking for" autocomplete="off">
        <button type="button" class="inline-chip" id="discover-chip" aria-label="Surprise me"><i class="ti ti-arrows-shuffle" aria-hidden="true"></i><span>Surprise me</span></button>
      </div>
    </form>
  </div>

  <p id="status"></p>
  <p id="results-meta"></p>
  <div id="results-grid" class="results-grid"></div>

  <p class="foot-note">
    No account needed. Results link straight to each maker's own site.<br>
    Equally relevant results are shown in random order &mdash; nobody paid to be here.<br>
    <a href="about.html">About Formground</a>
  </p>
</main>

<script>
  const API_BASE = window.FORMGROUND_API_BASE || "https://formground-git-182928637479.europe-west1.run.app";

  const form = document.getElementById("search-form");
  const input = document.getElementById("query-input");
  const statusEl = document.getElementById("status");
  const metaEl = document.getElementById("results-meta");
  const gridEl = document.getElementById("results-grid");

  const CATEGORY_ICONS = {
    chair: "ti-armchair", stool: "ti-armchair", bench: "ti-armchair", seat: "ti-armchair",
    table: "ti-table", lamp: "ti-bulb", light: "ti-bulb", sconce: "ti-bulb",
    ceramic: "ti-vase", vase: "ti-vase", bowl: "ti-vase",
  };

  // A material that's just the singular of the category ("Ceramic" next
  // to category "Ceramics") isn't a distinguishing per-item fact - it's
  // the same word repeated on every card from that brand, reading as a
  // fake category label sitting where no other card shows one.
  function materialDuplicatesCategory(material, category) {
    if (!material || !category) return false;
    const norm = (s) => s.trim().toLowerCase().replace(/s$/, "");
    return norm(material) === norm(category);
  }

  function iconFor(category) {
    const c = (category || "").toLowerCase();
    for (const key in CATEGORY_ICONS) {
      if (c.includes(key)) return CATEGORY_ICONS[key];
    }
    return "ti-photo";
  }

  function iconMarkup(category) {
    return `<i class="ti ${iconFor(category)}" aria-hidden="true"></i>`;
  }

  function renderCard(r) {
    const a = document.createElement("a");
    a.className = "card" + (r.thin ? " thin" : "");
    // Falls back to the brand's homepage if check_links.py has flagged
    // this product page as a confirmed 404, so a card never leads to a
    // dead link between full scrapes.
    a.href = r.link_dead ? r.brand_url : r.product_url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";

    const imageDiv = document.createElement("div");
    imageDiv.className = "card-image";
    if (r.image_url) {
      // Set via property, not interpolated into an HTML string - this is
      // scraped data from an external site, not something to trust blindly.
      const img = document.createElement("img");
      img.src = r.image_url;
      img.alt = "";
      img.loading = "lazy";
      img.onerror = () => { imageDiv.innerHTML = iconMarkup(r.category); };
      imageDiv.appendChild(img);
    } else {
      imageDiv.innerHTML = iconMarkup(r.category);
    }

    // Confirming the exact material the user searched for ("Available in
    // black") is a real, query-relevant fact worth the info-icon - a bare
    // variant count is not (some In Common With fixtures merge 1000+ raw
    // color/length SKUs into one card; "available in 1680 variants" tells
    // nobody anything useful). r.notes is kept as a general-purpose
    // per-item note field for any future real per-item fact, but nothing
    // populates it today.
    const materials = r.material_options || [];
    // Same "reads as a fake category label" problem as
    // materialDuplicatesCategory below applies here too - confirming
    // "Available in Ceramic" on a ceramics maker's card is redundant
    // with the brand/category context, unlike "Available in Black" on a
    // chair, which is genuinely informative. Filter per matched term
    // (matched_material can hold more than one, e.g. "black, oak") so a
    // genuinely useful term still shows even if another one is filtered.
    const matchedTerms = (r.matched_material || "")
      .split(", ")
      .filter((t) => t && !materialDuplicatesCategory(t, r.category));
    const noteText = matchedTerms.length
      ? `Available in ${matchedTerms.map((t) => t.charAt(0).toUpperCase() + t.slice(1)).join(", ")}`
      : (r.notes || "");

    const body = document.createElement("div");
    body.className = "card-body";
    body.innerHTML = `
      <p class="card-title"></p>
      <p class="card-brand"></p>
      ${noteText
        ? `<p class="card-note"><i class="ti ti-info-circle" aria-hidden="true"></i><span></span></p>`
        : `<p class="card-detail"></p>`}
    `;
    body.querySelector(".card-title").textContent = r.product_name;
    body.querySelector(".card-brand").textContent = r.brand;
    if (noteText) {
      body.querySelector(".card-note span").textContent = noteText;
    } else if (materials.length <= 1 && !(materials.length === 1 && materialDuplicatesCategory(materials[0], r.category))) {
      // materials.length > 1 with no note falls through to show nothing
      // rather than dumping every raw finish combo as one long string -
      // that's exactly the noise a real multi-material search match now
      // resolves to a clean "Available in X" above instead.
      body.querySelector(".card-detail").textContent = materials.join(", ") || r.dimensions || "";
    }

    a.appendChild(imageDiv);
    a.appendChild(body);
    return a;
  }

  function renderResults(results, metaText, emptyText) {
    gridEl.innerHTML = "";
    statusEl.style.display = "none";

    if (results.length === 0) {
      statusEl.className = "";
      statusEl.style.display = "block";
      statusEl.textContent = emptyText;
      metaEl.style.display = "none";
      return;
    }

    metaEl.textContent = metaText(results.length);
    metaEl.style.display = "block";
    results.forEach(r => gridEl.appendChild(renderCard(r)));
  }

  async function runSearch(query) {
    gridEl.innerHTML = "";
    metaEl.style.display = "none";
    statusEl.className = "";
    statusEl.style.display = "block";
    statusEl.textContent = "Searching…";

    try {
      const resp = await fetch(`${API_BASE}/search?q=${encodeURIComponent(query)}`);
      if (!resp.ok) throw new Error(`Server returned ${resp.status}`);
      const data = await resp.json();
      renderResults(
        data.results || [],
        (n) => `${n} result${n === 1 ? "" : "s"}, real makers, no rankings`,
        "No matches yet - try describing it a different way."
      );
    } catch (err) {
      statusEl.className = "error";
      statusEl.style.display = "block";
      statusEl.textContent = "Couldn't reach Formground's search right now - please try again shortly.";
      console.error(err);
    }
  }

  async function runDiscover() {
    gridEl.innerHTML = "";
    metaEl.style.display = "none";
    statusEl.className = "";
    statusEl.style.display = "block";
    statusEl.textContent = "Shuffling…";

    try {
      const resp = await fetch(`${API_BASE}/discover`);
      if (!resp.ok) throw new Error(`Server returned ${resp.status}`);
      const data = await resp.json();
      renderResults(
        data.results || [],
        (n) => `${n} real objects, picked at random across every maker`,
        "Nothing to discover yet."
      );
    } catch (err) {
      statusEl.className = "error";
      statusEl.style.display = "block";
      statusEl.textContent = "Couldn't reach Formground right now - please try again shortly.";
      console.error(err);
    }
  }

  // Typing "random" is a shortcut for the same random browse the
  // "Surprise me" chip triggers - either way should feel like the same
  // feature, not two different things that happen to look similar.
  function submitQuery(q) {
    if (q.trim().toLowerCase() === "random") {
      runDiscover();
    } else if (q) {
      runSearch(q);
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    submitQuery(input.value.trim());
  });

  // Explicit fallback: don't rely solely on native "Enter submits the
  // form" behavior for a single-input form - some environments don't
  // reliably dispatch that.
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      submitQuery(input.value.trim());
    }
  });

  // Blank field: full random discovery, same as before. A typed query:
  // re-run that same search instead - results are capped per brand and
  // randomly selected each time (see cap_per_brand), so a search with
  // more matches than shown surfaces a fresh set rather than the same
  // one every time.
  document.getElementById("discover-chip").addEventListener("click", () => {
    const q = input.value.trim();
    if (q) {
      submitQuery(q);
    } else {
      runDiscover();
    }
  });
</script>

</body>
</html>
