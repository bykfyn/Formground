<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Formground</title>
<meta name="description" content="Want to be listed on Formground, or want your work removed? Get in touch directly — no account, no submission process.">
<meta property="og:title" content="Contact — Formground">
<meta property="og:description" content="Want to be listed on Formground, or want your work removed? Get in touch directly — no account, no submission process.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://formground.com/contact.html">
<meta property="og:site_name" content="Formground">
<link rel="canonical" href="https://formground.com/contact.html">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Contact — Formground">
<meta name="twitter:description" content="Want to be listed on Formground, or want your work removed? Get in touch directly.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="site.css">
<style>
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 64px 20px 60px;
  }

  p.intro { font-size: 15px; line-height: 1.6; color: var(--text-secondary); margin: 0 0 32px; }

  label {
    display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary);
    margin: 0 0 6px;
  }
  .field { margin-bottom: 18px; }
  input[type="text"], input[type="email"], input[type="url"], select, textarea {
    width: 100%; font-size: 14px; font-family: inherit; color: var(--text-primary);
    background: var(--surface-1); border: 0.5px solid var(--border);
    border-radius: var(--radius); padding: 11px 13px; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--border-strong); }
  textarea { resize: vertical; min-height: 90px; }
  .optional { color: var(--text-muted); font-weight: 400; }

  /* Honeypot field - hidden from real visitors, catches bots that fill
     every field programmatically. */
  .hp { position: absolute; left: -9999px; }

  button[type="submit"] {
    font-size: 14px; font-weight: 500; color: var(--surface-2);
    background: var(--text-primary); border: none; border-radius: var(--radius);
    padding: 12px 20px; cursor: pointer; font-family: inherit;
  }
  button[type="submit"]:hover { background: var(--text-secondary); }
  button[type="submit"]:disabled { opacity: 0.6; cursor: default; }

  #form-status {
    font-size: 14px; margin-top: 16px; display: none;
  }
  #form-status.success { color: var(--text-accent); }
  #form-status.error { color: #a14b3f; }
</style>
</head>
<body>

<main>
  <a class="home-link" href="/"><img src="logo/formground_logotype_RGB.png" alt="Formground"></a>

  <h1>Get in touch</h1>
  <p class="intro">
    Want your work listed on Formground, or want it removed? Either way,
    just tell us here — no account, no submission process to maintain.
  </p>

  <form id="contact-form">
    <div class="field">
      <label for="name">Your name</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div class="field">
      <label for="brand">Brand / studio name</label>
      <input type="text" id="brand" name="brand" required>
    </div>
    <div class="field">
      <label for="website">Website <span class="optional">(optional)</span></label>
      <input type="text" id="website" name="website" placeholder="formground.com">
    </div>
    <div class="field">
      <label for="social">Social media <span class="optional">(optional)</span></label>
      <input type="text" id="social" name="social" placeholder="@yourstudio or a profile link">
    </div>
    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="field">
      <label for="reason">What's this about?</label>
      <select id="reason" name="reason">
        <option>I'd like my work listed</option>
        <option>Please remove my listing</option>
        <option>Something else</option>
      </select>
    </div>
    <div class="field">
      <label for="message">Message <span class="optional">(optional)</span></label>
      <textarea id="message" name="message"></textarea>
    </div>
    <input class="hp" type="checkbox" name="botcheck" tabindex="-1" autocomplete="off">
    <button type="submit" id="submit-btn">Send</button>
  </form>
  <p id="form-status"></p>

  <p class="foot-note">
    <a href="/">← Back to Formground</a> &middot; <a href="about.html">About Formground</a> &middot; <a href="makers.html">Makers</a>
  </p>
</main>

<script>
  const form = document.getElementById("contact-form");
  const statusEl = document.getElementById("form-status");
  const submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    statusEl.style.display = "none";

    try {
      const payload = Object.fromEntries(new FormData(form));
      payload.access_key = "fc15b03d-9cf7-4a99-ba3a-9eebd86b08b0";
      payload.subject = "New Formground contact form submission";

      const resp = await fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await resp.json();
      if (!resp.ok || !data.success) throw new Error(data.message || `Server returned ${resp.status}`);

      form.hidden = true;
      statusEl.className = "success";
      statusEl.style.display = "block";
      statusEl.textContent = "Thanks — we'll be in touch.";
    } catch (err) {
      statusEl.className = "error";
      statusEl.style.display = "block";
      statusEl.textContent = "Something went wrong sending that - try again, or email info@formground.com directly.";
      submitBtn.disabled = false;
      console.error(err);
    }
  });
</script>

</body>
</html>
